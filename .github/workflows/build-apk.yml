name: Build Fuzul Planim APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: fuzul-planim-debug-keystore-v1
      - name: Create stable debug keystore if needed
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Fuzul Planim Dev,O=Mercan Development,C=TR"
          fi
      - name: Install SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --no-daemon --stacktrace 2>&1 | tee build.log
      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FuzulPlanim-build-log
          path: build.log
          if-no-files-found: warn
      - name: Rename APK
        if: success()
        run: cp app/build/outputs/apk/debug/app-debug.apk FuzulPlanim-v2.0.apk
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FuzulPlanim-v2.0-APK
          path: FuzulPlanim-v2.0.apk
          if-no-files-found: error
